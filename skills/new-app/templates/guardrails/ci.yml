# Copied to .github/workflows/ci.yml. Static checks, the fast test suite and the docs check on every push.
# Slow, real-app, large-data and live tests run locally only (ARCHITECTURE.md §6).
# This is the WeakSquare shape (uv + npm, Windows); adapt the steps to the stack.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: {{CI_RUNNER, e.g. windows-latest}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_docs.py compares against main

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python packages (locked)
        run: uv sync --locked

      - name: Install front-end packages (locked)
        run: npm ci
        working-directory: web

      - name: Lint and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Front end checks
        run: |
          npm run typecheck
          npm run lint
          npm run build
        working-directory: web

      - name: Tests
        run: uv run pytest

      - name: Docs check
        run: uv run python scripts/check_docs.py --base origin/main
