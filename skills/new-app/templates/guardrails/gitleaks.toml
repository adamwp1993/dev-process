title = "{{APP_SLUG}} gitleaks config"

# Keep all of gitleaks' built-in rules (they include Anthropic, OpenAI, GitHub and AWS key formats).
[extend]
useDefault = true

[[rules]]
id = "bearer-header"
description = "Hard-coded Authorization: Bearer value"
regex = '''(?i)authorization["'\s:=]+bearer\s+[A-Za-z0-9_\-\.]{20,}'''
keywords = ["bearer"]

# Add a rule per service-specific token format this app handles, e.g.
# [[rules]]
# id = "lichess-token"
# regex = '''\bli[a-z]_[A-Za-z0-9]{16,}\b'''
# keywords = ["lip_", "lio_", "liu_"]

# Obvious test placeholders are fine.
[[allowlists]]
description = "Test placeholders"
regexes = [
  '''\w*FAKE\w*''',
  '''REDACTED''',
]
